<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DD Analyst | Desirae Duncan</title>
  <script>
  (function () {
    var isPhone = /iPhone|iPod|Android.*Mobile|Windows Phone/i.test(navigator.userAgent);
    var isSmallScreen = window.matchMedia("(max-width: 767px)").matches;

    if (isPhone || isSmallScreen) {
      window.location.replace("./mobile.html");
    } else {
      window.location.replace("./desktop.html");
    }
  })();
</script>
</head>
<body>
  <main style="font-family:Arial,sans-serif;padding:24px;text-align:center;">
    <h1>DD Analyst</h1>
    <p>Opening the correct version for your device…</p>
    <p>
      <a href="./mobile.html">Mobile version</a>
      &nbsp;|&nbsp;
      <a href="./desktop.html">Desktop version</a>
    </p>
  </main>
</body>
</html>
